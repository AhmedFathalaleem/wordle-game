name: Deploy WordleClone to S3

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build --workspace=@portfolio/web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::229378727473:role/GitHubActionsWordleDeploy
          aws-region: eu-north-1

      - name: Deploy to S3
        run: aws s3 sync ./apps/web/dist s3://wordle-s3-bucket-229378727473-eu-north-1-an --delete