name: Deploy WordleClone to S3

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::229378727473:role/GitHubActionsWordleDeploy
          aws-region: eu-north-1

      - name: Prepare Wordle static assets
        run: |
          mkdir -p deploy
          cp index.html game.js styles.css words.js deploy/

      - name: Deploy to S3
        run: >-
          aws s3 sync ./deploy s3://wordle-s3-bucket-229378727473-eu-north-1-an
          --delete
          --cache-control "no-cache, no-store, must-revalidate"