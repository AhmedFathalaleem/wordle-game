<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <button id="stats-btn" class="icon-btn" aria-label="Statistics">📊</button>
      <h1>Wordle</h1>
      <button id="help-btn" class="icon-btn" aria-label="Help">?</button>
    </header>

    <div id="toast" class="toast hidden" role="status"></div>

    <div id="board" aria-label="Game board"></div>

    <div id="keyboard" aria-label="On-screen keyboard"></div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal" role="dialog" aria-modal="true">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="game.js"></script>
</body>
</html>
